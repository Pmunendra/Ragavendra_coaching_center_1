{% extends "base.html" %}
{% block title %}{{ 'Edit' if plan else 'New' }} Plan · Exam Portal{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">{{ 'Edit Plan' if plan else 'New Subscription Plan' }}</h4>

<div class="card p-4">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Course *</label>
        <select name="course_id" class="form-select" required>
          <option value="">Select a course</option>
          {% for c in courses %}
          <option value="{{ c.id }}" {{ 'selected' if plan and plan.course_id == c.id else '' }}>{{ c.title }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Plan Name *</label>
        <input type="text" name="name" class="form-control" required placeholder="e.g. 6 Months"
               value="{{ plan.name if plan else '' }}">
      </div>

      <div class="col-md-4">
        <label class="form-label">Duration Value *</label>
        <input type="number" min="1" name="duration_value" class="form-control" required
               value="{{ plan.duration_value if plan else 3 }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Duration Unit *</label>
        <select name="duration_unit" class="form-select">
          <option value="days" {{ 'selected' if plan and plan.duration_unit == 'days' else '' }}>Days</option>
          <option value="months" {{ 'selected' if not plan or plan.duration_unit == 'months' else '' }}>Months</option>
          <option value="years" {{ 'selected' if plan and plan.duration_unit == 'years' else '' }}>Years</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Price (&#8377;) *</label>
        <input type="number" step="0.01" min="0" name="price" class="form-control" required
               value="{{ plan.price if plan else 0 }}">
      </div>

      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="2">{{ plan.description if plan else '' }}</textarea>
      </div>

      <div class="col-12"><hr><h6 class="fw-bold text-muted">Included Access</h6></div>
      <div class="col-md-4">
        <div class="form-check form-switch mt-2">
          <input class="form-check-input" type="checkbox" name="includes_materials" id="im"
                 {{ 'checked' if not plan or plan.includes_materials else '' }}>
          <label class="form-check-label" for="im">Study Materials / PDFs</label>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-check form-switch mt-2">
          <input class="form-check-input" type="checkbox" name="includes_mock_tests" id="imt"
                 {{ 'checked' if not plan or plan.includes_mock_tests else '' }}>
          <label class="form-check-label" for="imt">Mock Tests</label>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-check form-switch mt-2">
          <input class="form-check-input" type="checkbox" name="includes_main_tests" id="imn"
                 {{ 'checked' if not plan or plan.includes_main_tests else '' }}>
          <label class="form-check-label" for="imn">Main Tests</label>
        </div>
      </div>

      {% if plan %}
      <div class="col-md-4">
        <div class="form-check form-switch mt-2">
          <input class="form-check-input" type="checkbox" name="is_active" id="ia"
                 {{ 'checked' if plan.is_active else '' }}>
          <label class="form-check-label" for="ia">Plan Active</label>
        </div>
      </div>
      {% endif %}
    </div>

    <div class="mt-4">
      <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Save Plan</button>
      <a href="{{ url_for('admin.plans_list') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
